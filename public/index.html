<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; background: #f2f2f2; }
    #messages { flex: 1; overflow-y: auto; padding: 12px; }
    .msg { background: #fff; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; max-width: 80%; }
    .msg.me { background: #d9f0ff; margin-left: auto; }
    .msg b { display: block; font-size: 12px; color: #555; }
    form { display: flex; gap: 8px; padding: 10px; background: #fff; }
    input { flex: 1; padding: 10px; font-size: 16px; }
    button { padding: 10px 16px; font-size: 16px; }
  </style>
</head>
<body>
  <div id="messages"></div>
  <form id="form">
    <input id="text" placeholder="Type a message" autocomplete="off" required>
    <button>Send</button>
  </form>
  <script>
    let username = localStorage.getItem('username');
    if (!username) {
      username = (prompt('Your name?') || 'Anonymous').slice(0, 30);
      localStorage.setItem('username', username);
    }
    const box = document.getElementById('messages');
    let lastId = 0;

    async function load() {
      const res = await fetch('/api/messages?after=' + lastId);
      if (!res.ok) return;
      const rows = await res.json();
      if (!rows.length) return;
      const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 50;
      for (const m of rows) {
        const div = document.createElement('div');
        div.className = 'msg' + (m.username === username ? ' me' : '');
        const name = document.createElement('b');
        name.textContent = m.username;
        const text = document.createElement('span');
        text.textContent = m.text;
        div.append(name, text);
        box.append(div);
        lastId = m.id;
      }
      if (atBottom) box.scrollTop = box.scrollHeight;
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('text');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, text })
      });
      await load();
      box.scrollTop = box.scrollHeight;
    });

    load();
    setInterval(load, 2000);
  </script>
</body>
</html>
